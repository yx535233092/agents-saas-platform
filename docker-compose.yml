# ==================== Agents SaaS Platform Docker Compose ====================
# 使用方法：
#   启动所有服务：docker-compose up -d
#   查看日志：docker-compose logs -f
#   停止服务：docker-compose down
#   重新构建：docker-compose up -d --build

version: "3.8"

services:
  # -------------------- FastAPI Backend --------------------
  backend:
    build:
      context: ./agents-backend-fastapi
      dockerfile: Dockerfile
    container_name: agents-backend
    ports:
      - "8000:8000"
    volumes:
      # 开发环境挂载代码目录，支持热重载
      - ./agents-backend-fastapi:/app
      # 持久化数据库
      - backend-data:/app/data
    environment:
      - H3C_AUTH_SERVICE_URL=http://h3c-auth:8000
      - H3C_AUTH_JWT_SECRET_KEY=${H3C_AUTH_JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-your-api-key-here}
      - DEFAULT_MODEL=${MODEL:-gpt-3.5-turbo}
    depends_on:
      - h3c-auth
    networks:
      - agents-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # -------------------- h3c-auth Service --------------------
  h3c-auth:
    build:
      context: ../h3c-auth
      dockerfile: Dockerfile
    container_name: h3c-auth
    ports:
      - "8001:8000"
    volumes:
      - ./h3c-auth-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/auth.db
      - SECRET_KEY=${H3C_AUTH_JWT_SECRET_KEY:-your-secret-key-change-in-production}
    networks:
      - agents-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # -------------------- LangGraph Agent Service --------------------
  langgraph:
    build:
      context: ./agents-langgraph
      dockerfile: Dockerfile
    container_name: agents-langgraph
    ports:
      - "5001:5001"
    volumes:
      # 开发环境挂载代码目录
      - ./agents-langgraph:/app
    environment:
      - MODEL=${MODEL:-Qwen/Qwen3-8B}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-your-api-key-here}
    networks:
      - agents-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5001/docs')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # -------------------- React Frontend --------------------
  frontend:
    build:
      context: ./agents-web
      dockerfile: Dockerfile
    container_name: agents-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - langgraph
      - h3c-auth
    networks:
      - agents-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# -------------------- Networks --------------------
networks:
  agents-network:
    driver: bridge

# -------------------- Volumes --------------------
volumes:
  backend-data:
    driver: local
